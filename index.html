<!doctype html>

<head>

<title>xcsaee</title>
<style>
html, body { height: 100%; }
/*
  Layout concept: a Discord profile popout, floating over the same
  misty swamp-forest photo used for the page backdrop — banner at the
  top of the card, avatar cut into it, status line, a bio section that
  lists each platform the way Discord lists connections. Single
  committed dark theme (Discord has no light mode to borrow either).
*/
:root {
  --bg: #000000;
  --card-bg: #1e1f22;
  --card-head: #232428;
  --row-bg: #2b2d31;
  --row-bg-hover: #35373c;
  --text: #f2f3f5;
  --text-dim: #b5bac1;
  --text-muted: #949ba4;
  --divider: #3a3c42;
  --blurple: #5865f2;
  --online: #23a55a;
  color-scheme: dark;

  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100%;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.82) 55%, #000 100%),
    url("forest.jpg") center 22% / cover no-repeat fixed,
    var(--bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.page {
  width: 100%;
  max-width: 460px;
  padding-block: 56px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

/* ---- the popout card ---- */
.card {
  width: 100%;
  background: var(--card-bg);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 24px 60px -24px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
}

.banner {
  height: 112px;
  background: url("forest.jpg") center 18% / cover no-repeat;
  position: relative;
}
.banner::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.1), var(--card-head) 100%);
}

.card-head {
  background: var(--card-head);
  padding: 0 20px 16px;
  position: relative;
}

.avatar-wrap {
  width: 84px;
  height: 84px;
  margin-top: -42px;
  position: relative;
}
.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: url("forest.jpg") center 30% / cover no-repeat, #111214;
  border: 6px solid var(--card-head);
  display: block;
}
.status-dot {
  position: absolute;
  right: 1px;
  bottom: 1px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--online);
  border: 5px solid var(--card-head);
}

.id-block {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.display-name {
  font-family: "Space Grotesk", "Inter", sans-serif;
  font-weight: 700;
  font-size: 21px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.handle {
  font-size: 13px;
  color: var(--text-muted);
}
.status-line {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--text-dim);
}
.status-line::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--online);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--online) 18%, transparent);
  flex: none;
}

.card-body {
  padding: 16px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.divider {
  height: 1px;
  background: var(--divider);
  border: none;
  margin: 0;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ---- link rows, styled like Discord's connected-account list ---- */
.links {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.link-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--row-bg);
  border: none;
  color: var(--text);
  text-decoration: none;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: background 0.12s ease;
}
.link-row:hover,
.link-row:focus-visible {
  background: var(--row-bg-hover);
  outline: none;
}

.icon {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: color-mix(in srgb, var(--platform, var(--blurple)) 22%, var(--row-bg));
  color: var(--platform, var(--blurple));
}
.icon svg { width: 17px; height: 17px; fill: currentColor; }

.link-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0px;
}
.link-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
}
.link-sub {
  font-size: 12.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.go {
  flex: none;
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1;
}

.copy-btn {
  flex: none;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: rgba(255,255,255,0.06);
  border: none;
  border-radius: 6px;
  padding: 6px 10px;
  transition: color 0.12s ease, background 0.12s ease;
}
.copy-btn:hover, .copy-btn:focus-visible {
  color: var(--text);
  background: rgba(255,255,255,0.12);
  outline: none;
}

footer {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}
</style>

<script>
function copyText(text, btn) {
  var label = document.getElementById('ds-copy-label');
  function done(ok) {
    if (!label) return;
    label.textContent = ok ? 'Copied' : 'Copy';
    if (ok) setTimeout(function () { label.textContent = 'Copy'; }, 1400);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () {
      fallbackCopy(text);
      done(true);
    });
  } else {
    fallbackCopy(text);
    done(true);
  }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
</script>
